validation:
  test_manifest_sources: [.github/workflows/]
  precommit: true

ci:
  provider: github_actions

push:
  default_remote: fork
  remote_url: https://github.com/jiaran-king/afd-plugin.git
  rebase_branch: codex/vllm-0.28-sync
  rebase_branch_allowed: true
  protected_branches: [main, master]
  allowed: true

rebase:
  lock_name: afd-plugin
  precommit:
    command: pre-commit run --all-files
    timeout_sec: 600
    retry_once: true
  testing:
    python: ${AFD_PLUGIN_PYTHON}
    artifact_globs: []
  wheel:
    package: vllm
    index_url_template: "https://wheels.vllm.ai/{commit}/{variant}/{package}/"
    variant: ${VLLM_WHEEL_VARIANT}
    arch: ${VLLM_WHEEL_ARCH}
    import_check_modules: [vllm]
    install_env: {VLLM_USE_PRECOMPILED: "1"}
    reinstall_retries: 3
  local_tests:
    source: adapter
    command: >-
      python -m pytest -q tests/unit -m "not gpu and not npu and not
      vllm_runtime and not e2e"
    timeout_sec: 1800
    module: plugin_boundary
    min_gpus: 0
    hardware: cpu
  test_manifest:
    yaml_dir: .infermatrix-copilot
    pipelines: {local-tests.yml: local}
    priority_source: local
    queue_map: {cpu: [0, cpu]}
    default_queue: cpu
    skip_patterns: []
    rename_suffixes: []
    file_ref_prefixes: [tests, afd_plugin]
    file_tree_roots: [tests, afd_plugin]
    test_change_roots: [tests/]
    assignment_paths:
      plugin_boundary: [tests/unit/config/, tests/unit/package/, tests/unit/test_envs.py]
      attention_runtime: [tests/unit/v1/worker/, tests/e2e/features/]
      ffn_runtime: [tests/unit/v1/worker/, tests/unit/model_executor/]
      connectors: [tests/unit/connectors/, tests/unit/distributed/]
      model_integration: [tests/unit/model_executor/, tests/unit/package/]
      execution_platforms: [tests/unit/v1/worker/, tests/unit/compat/]
      compatibility: [tests/unit/compat/, tests/unit/v1/worker/]
    change_path_rules:
    - [afd_plugin/v1/worker/attention, attention_runtime]
    - [afd_plugin/v1/worker/ffn, ffn_runtime]
    - [afd_plugin/connectors, connectors]
    - [afd_plugin/distributed, connectors]
    - [afd_plugin/model_executor, model_integration]
    - [afd_plugin/compat, compatibility]
    - [tests/unit, plugin_boundary]
    setup_map: {}
