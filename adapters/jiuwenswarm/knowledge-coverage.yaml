schema_version: 1
required: true
semantic_depth:
  per_facet_gt: 0.90
catalog_sources:
- README_CN.md
- docs/README.md
- docs/zh/Harness.md
- docs/zh/智能体.md
- docs/zh/JiuwenMemory-SDK接入.md
- docs/zh/配置信息.md
- jiuwenbox/README_CN.md
- jiuwenswarm/channels/web/AGENTS.md
- jiuwenswarm/channels/web/frontend/README.md
- docs/zh/设置与频道升级迁移指南.md
- jiuwenswarm/server/runtime/skill/skilldev/DESIGN.md
core:
  roots:
  - jiuwenswarm/
  - jiuwenbox/src/jiuwenbox/
  - jiuwenbox/scripts/
  - sdks/
  - packages/
  - scripts/
  - deploy/
  - docker/
  - Dockerfile.claw
  - jiuwenbox/docker/
  - Makefile
  exclude:
  - '*/tests/*'
  - '*/test/*'
  - '*/__tests__/*'
  - '*.test.*'
  - '*.spec.*'
  - '*/node_modules/*'
  - '*/third_party/*'
  - '*/vendor/*'
  - '*/dist/*'
  - '*/build/*'
  - '*/generated/*'
  - '*/__pycache__/*'
  - scripts/acceptance/*
  - scripts/genai_semconv/*
  - '*/third-party/*'
  suffixes:
  - .py
  - .ts
  - .tsx
  - .mts
  - .cts
  - .js
  - .jsx
  - .mjs
  - .cjs
  - .kt
  - .kts
  - .java
  - .rs
  - .go
  - .swift
  - .ets
  - .vue
  - .svelte
  - .html
  - .css
  - .scss
  - .less
  - .c
  - .cc
  - .cpp
  - .h
  - .hpp
  - .sh
  - .ps1
  - .psm1
  - .cmd
  - .bat
  - .iss
  - .spec
  target: 0.85
  filenames:
  - Dockerfile
  - Dockerfile.*
  - Makefile
  - gradlew
