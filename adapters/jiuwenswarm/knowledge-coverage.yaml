  - .ts
  - .tsx
  - .mts
  - .cts
  - .js
  - .jsx
  - .mjs
  - .cjs
  - .kt
  - .kts
  - .java
  - .rs
  - .go
  - .swift
  - .ets
  - .vue
  - .svelte
  - .html
  - .css
  - .scss
  - .less
  - .c
  - .cc
  - .cpp
  - .h
  - .hpp
  - .sh
  - .ps1
  - .psm1
  - .cmd
  - .bat
  - .iss
  - .spec
  target: 0.85
  filenames:
  - Dockerfile
  - Dockerfile.*
  - Makefile
  - gradlew
