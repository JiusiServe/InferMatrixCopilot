# Knowledge intake, the drafting step (static): one merged upstream PR in,
# typed knowledge operations out. Tier 2 comparative: the adapter scores a
# unit with the knowledge quality gate (L1 + the pinned L2 judge on every
# block) and, when gold is registered for the item, with a gold-match judge
# over the incumbent's gate-passing rules. Repo-neutral: the fingerprint
# covers the drafting code, the generator and the strategy, never a target
# repository.
workflow: kb-intake.draft
kind: static
unit: step_call
item_key: "{repo}#{pr}"
fingerprint:
  covers:
    - settings: [kb_draft_max_operations, agent_model, eco_model, performance_model, llm_max_tokens]
    - resolved_models
    - prompts: ["kb_service/intake.py"]
    # routing knobs read from the environment, then the same-named setting
    # when the tree has it (zcode's reasoning level is a Settings field only
    # where the per-run model pin exists): a cover that never goes missing
    - routing: [KB_GENERATOR, KB_DRAFT_STRATEGY, ZCODE_REASONING_LEVEL]
    - copilot_sha
capture: full
outcome_adapter: infermatrix_copilot.improve.adapters.kb_intake:KbIntakeAdapter
tier2_min_items: 8
shadow_tools: []
shadow_executables: [python3, git, grep]
experiment_driver: kb-intake
evolution:
  paths: [src/infermatrix_copilot/kb_service/intake.py]
  settings: [KB_DRAFT_MAX_OPERATIONS]
  tests: [test/test_improve_kb_intake_adapter.py, test/test_kb_intake_gate.py]
  metric: net_pass_review
  direction: higher
  min_effect: 0.05
  guards: {recall_gold: higher, fail_review: lower, usd_review: lower}
