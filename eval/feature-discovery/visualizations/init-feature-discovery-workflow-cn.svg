<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1680" viewBox="0 0 1600 1680" font-family="Arial, Droid Sans Fallback, sans-serif"><rect width="100%" height="100%" fill="#f3f6fb"/><text x="60" y="62" font-size="34" fill="#18273e">通用知识初始化 · 文档功能发现 → 源码扩展发现</text><text x="60" y="103" font-size="20" fill="#62738a">三个大阶段 + 一个目录发现交接步骤；适用于服务、SDK、前端与多语言仓库</text><rect x="60" y="135" width="1070" height="85" rx="14" fill="#e7f2ff" stroke="#bad5f4"/><text x="80" y="172" font-size="25" fill="#20568b">选择仓库 → 加载适配配置 → 固定源码 SHA 与本轮范围</text><text x="80" y="202" font-size="18" fill="#62738a">已有目录作为种子；旧仓库显式启用发现，新初始化配置启用目录发现。</text><rect x="60" y="250" width="250" height="62" rx="14" fill="#ffffff" stroke="#dce4ee"/><text x="72" y="278" font-size="20" fill="#20568b">源码与测试</text><text x="72" y="299" font-size="13" fill="#62738a">生产库存、入口、导出与断言</text><rect x="330" y="250" width="250" height="62" rx="14" fill="#ffffff" stroke="#dce4ee"/><text x="342" y="278" font-size="20" fill="#20568b">项目文档</text><text x="342" y="299" font-size="13" fill="#62738a">README、架构、API 与指南</text><rect x="600" y="250" width="250" height="62" rx="14" fill="#ffffff" stroke="#dce4ee"/><text x="612" y="278" font-size="20" fill="#20568b">维护者资料</text><text x="612" y="299" font-size="13" fill="#62738a">局部知识与设计决策</text><rect x="870" y="250" width="250" height="62" rx="14" fill="#ffffff" stroke="#dce4ee"/><text x="882" y="278" font-size="20" fill="#20568b">已有知识</text><text x="882" y="299" font-size="13" fill="#62738a">稳定功能 ID 与 owner 路由</text><rect x="60" y="345" width="1070" height="125" rx="14" fill="#ffffff" stroke="#c9d9ec"/><text x="80" y="383" font-size="26" fill="#20568b">阶段 1 · Skeleton：建骨架</text><text x="80" y="419" font-size="20" fill="#18273e">确定仓库、目录与初始组件边界，明确后续扫描范围与索引策略。</text><text x="80" y="452" font-size="18" fill="#62738a">范围和排除规则由仓库配置确定；未知语言保留文本发现与未解析记录。</text><path d="M 595 470 L 595 526" stroke="#839dbb" stroke-width="3"/><polygon points="588,525 602,525 595,535" fill="#839dbb"/><rect x="60" y="535" width="1070" height="460" rx="14" fill="#f4efff" stroke="#d6c7ef"/><text x="80" y="572" font-size="26" fill="#704c9a">阶段交接 · Feature Discovery：发现并冻结功能目录</text><rect x="80" y="602" width="1030" height="72" rx="14" fill="#ffffff"/><text x="97" y="631" font-size="22" fill="#704c9a">文档轮：建立功能基线</text><text x="97" y="659" font-size="17" fill="#62738a">建立共享索引，按文件识别语言；提取文档正文中的能力与边界。</text><path d="M 595 674 L 595 683" stroke="#a28bbc" stroke-width="3"/><polygon points="588,682 602,682 595,692" fill="#a28bbc"/><rect x="80" y="692" width="1030" height="72" rx="14" fill="#ffffff"/><text x="97" y="721" font-size="22" fill="#704c9a">源码轮：寻找更多功能</text><text x="97" y="749" font-size="17" fill="#62738a">优先探索未关联入口，再遍历声明范围；CLI / API / UI / SDK / 注册 / 测试。</text><path d="M 595 764 L 595 773" stroke="#a28bbc" stroke-width="3"/><polygon points="588,772 602,772 595,782" fill="#a28bbc"/><rect x="80" y="782" width="1030" height="72" rx="14" fill="#ffffff"/><text x="97" y="811" font-size="22" fill="#704c9a">聚合去重与独立评审</text><text x="97" y="839" font-size="17" fill="#62738a">判断新增、实现补充、别名、子能力、共享组件、过期或未知；最多修正 3 次。</text><path d="M 595 854 L 595 863" stroke="#a28bbc" stroke-width="3"/><polygon points="588,862 602,862 595,872" fill="#a28bbc"/><rect x="80" y="872" width="1030" height="72" rx="14" fill="#ffffff"/><text x="97" y="901" font-size="22" fill="#704c9a">目录 PR → 审查合并 → 冻结</text><text x="97" y="929" font-size="17" fill="#62738a">保留旧 ID；实现证据与独立评审支持的新功能入列；绑定目录哈希与源码 SHA。</text><text x="80" y="987" font-size="16" fill="#704c9a">单项未知留在单项；预算耗尽或未处理分片保留检查点，不标为发现完成。</text><path d="M 595 995 L 595 1041" stroke="#839dbb" stroke-width="3"/><polygon points="588,1040 602,1040 595,1050" fill="#839dbb"/><rect x="60" y="1050" width="1070" height="135" rx="14" fill="#ffffff" stroke="#c9d9ec"/><text x="80" y="1088" font-size="26" fill="#20568b">阶段 2 · Modules / Knowledge：铺广度</text><text x="80" y="1125" font-size="20" fill="#18273e">使用冻结功能目录建立组件导航、基础说明、源码关联与缺口清单。</text><text x="80" y="1161" font-size="17" fill="#62738a">新 owner 在本阶段建立；有源码但无文档的功能仍可提取，结构与深度分开统计。</text><path d="M 595 1185 L 595 1231" stroke="#839dbb" stroke-width="3"/><polygon points="588,1230 602,1230 595,1240" fill="#839dbb"/><rect x="60" y="1240" width="1070" height="235" rx="14" fill="#ffffff" stroke="#c9d9ec"/><text x="80" y="1278" font-size="26" fill="#20568b">阶段 3 · Deepen / Acceptance：做深度并验收</text><text x="80" y="1315" font-size="18" fill="#62738a">按功能补齐七维知识 → Codex 独立评审 → 有限修正与未知留存</text><text x="80" y="1352" font-size="18" fill="#62738a">引用、哈希与认可记录审计 → 检索验收 → 独立审查 → CI → PR 交付</text><text x="80" y="1389" font-size="18" fill="#62738a">默认 GLM‑5.3 提取 / Codex 评审；共享并发 13，可通过批次配置覆盖</text><text x="80" y="1426" font-size="18" fill="#62738a">生产结构、知识认可、测试覆盖与真实 PR 效果分别报告；费用未报告则未知</text><rect x="1170" y="135" width="370" height="275" rx="14" fill="#eaf5ee" stroke="#bedcc9"/><text x="1190" y="175" font-size="23" fill="#2a6b45">贯穿流程的仓库配置</text><text x="1190" y="218" font-size="18" fill="#345e46">源码 SHA、范围与文档入口</text><text x="1190" y="248" font-size="18" fill="#345e46">逐文件语言与测试框架</text><text x="1190" y="278" font-size="18" fill="#345e46">owner 边界、模型与运行预算</text><text x="1190" y="308" font-size="18" fill="#345e46">发现目录冻结后采用 N × 7 分母</text><text x="1190" y="338" font-size="18" fill="#345e46"></text><text x="1190" y="368" font-size="18" fill="#345e46">工具流程共用，知识按仓库隔离</text><rect x="1170" y="465" width="370" height="120" rx="14" fill="#eaf5ee" stroke="#bedcc9"/><text x="1190" y="500" font-size="22" fill="#2a6b45">输入与索引适配</text><text x="1190" y="536" font-size="17" fill="#345e46">生产源码 / 测试 / 排除范围</text><text x="1190" y="566" font-size="17" fill="#345e46">未知语言不当作没有功能</text><path d="M 1170 525 H 1150 V 407" fill="none" stroke="#2a6b45" stroke-width="3"/><path d="M 1150 407 L 1139 407" stroke="#2a6b45" stroke-width="3"/><polygon points="1140,400 1140,414 1130,407" fill="#2a6b45"/><rect x="1170" y="665" width="370" height="120" rx="14" fill="#eaf5ee" stroke="#bedcc9"/><text x="1190" y="700" font-size="22" fill="#2a6b45">两轮发现共用输入</text><text x="1190" y="736" font-size="17" fill="#345e46">文档建立基线，源码扩展</text><text x="1190" y="766" font-size="17" fill="#345e46">完整库存、分片与证据引用</text><path d="M 1170 705 L 1139 705" stroke="#2a6b45" stroke-width="3"/><polygon points="1140,698 1140,712 1130,705" fill="#2a6b45"/><rect x="1170" y="1050" width="370" height="120" rx="14" fill="#eaf5ee" stroke="#bedcc9"/><text x="1190" y="1085" font-size="22" fill="#2a6b45">组件与任务适配</text><text x="1190" y="1121" font-size="17" fill="#345e46">Agent：运行时 / 渠道 / 客户端</text><text x="1190" y="1151" font-size="17" fill="#345e46">推理：引擎 / 模型 / 后端</text><path d="M 1170 1117 L 1139 1117" stroke="#2a6b45" stroke-width="3"/><polygon points="1140,1110 1140,1124 1130,1117" fill="#2a6b45"/><rect x="1170" y="1300" width="370" height="120" rx="14" fill="#eaf5ee" stroke="#bedcc9"/><text x="1190" y="1335" font-size="22" fill="#2a6b45">政策驱动验收</text><text x="1190" y="1371" font-size="17" fill="#345e46">采用本仓库覆盖目标与预算</text><text x="1190" y="1401" font-size="17" fill="#345e46">核对冻结目录和真实注入内容</text><path d="M 1170 1380 L 1139 1380" stroke="#2a6b45" stroke-width="3"/><polygon points="1140,1373 1140,1387 1130,1380" fill="#2a6b45"/><rect x="60" y="1530" width="1480" height="105" rx="14" fill="#18273e"/><text x="82" y="1567" font-size="23" fill="#ffffff">发现目录的完整性与知识覆盖是两件事：固定版本、真实证据、独立审查、未知不充数</text><text x="82" y="1605" font-size="18" fill="#d5e1f2">目录是已审查能力清单；声明范围已处理，不等于所有功能均已发现。未找到测试不声称无测试或已通过。</text></svg>