name: RFC service portability
on:
  pull_request:
    paths:
      - 'src/infermatrix_copilot/rfc_service/**'
      - 'src/infermatrix_copilot/sdk/v1/**'
      - 'test/test_rfc*'
      - 'pyproject.toml'
      - '.github/workflows/rfc-portability.yml'
  workflow_dispatch:
jobs:
  rfc:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest test/test_rfc_application.py test/test_rfc_providers.py test/test_rfc_http.py test/test_rfc_integration.py test/test_rfc_security.py test/test_rfc_migration.py test/test_rfc_graph.py test/test_rfc_markdown.py test/test_rfc_components.py test/test_rfc_translations.py
