# Generic stdio fallback. Prefer the marketplace plugin described in README.md.

[mcp_servers.infermatrix-copilot]
command = "uvx"
args = [
  "--from",
  "infermatrix-copilot[mcp] @ git+https://github.com/JiusiServe/InferMatrixCopilot.git@main",
  "infermatrix-copilot-mcp",
]
startup_timeout_sec = 60
tool_timeout_sec = 60

