# kb init for ONE repository: one stage per run (skeleton, then modules, then
# deepen + lifecycle flip, then harvest-calibration), each opened as a
# human-merged PR (design kb-init v3). Runs outside the knowledge service: it
# never writes the service ledger. Candidate.
name: kb-init
version: 1
status: candidate
provenance:
  created_by: human
  source: kb init design v3 (bootstrap a repository's knowledge base)
task_kinds: [knowledge_maintenance]
repos: []
requires: []
params:
  repo: "knowledge repository name"
  stage: "skeleton | modules | deepen | harvest-calibration"
  dry_run: "true (default): write the tree and PR body locally; false needs ALLOW_PUSH=1 and ALLOW_POST=1"
  pin: "upstream commit to pin (default: the default branch head)"
steps:
  - {id: init, step: knowledge.init}
success: the stage's PR is open (or its dry run is written), or the record says why it is blocked
