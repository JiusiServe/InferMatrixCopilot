<svg xmlns="http://www.w3.org/2000/svg" id="lifecycle-svg" width="1600" height="1350" viewBox="0 0 1600 1350" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Copilot 知识初始化与维护：五层职责图</title>
<desc id="diagram-desc">初始化五阶段与维护两步骤共用 WorkflowExecution.execute；领域记录各自持有业务事实和预算。复用内容、证据和审核，经发布及撤回到公开 SDK v1 与 review bot。主图是职责图；完整 393 个 Python 类在配套 HTML 和 JSON 中。源码摘要 d33216d221d50abf3929cda2ac08c01994f1ea1773039eb9bed471c86cda5b8a。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9baabd"/></marker></defs>
<style>text{font-family:Arial,"Droid Sans Fallback",sans-serif} .code{font-family:ui-monospace,"DejaVu Sans Mono",monospace}</style>
<rect width="1600" height="1350" fill="#f3f6fa"/>
<text x="60" y="55" font-size="36" fill="#1e3046" font-weight="700">知识初始化与维护</text>
<text x="60" y="89" font-size="20" fill="#60728b" font-weight="400">同一执行底座；领域记录各自持有事实与预算；每个 Python 类在展开视图中列出</text>
<text x="60" y="124" font-size="17" fill="#526a89" font-weight="400" class="code">124 个核心类 = 97 kb_service + 27 knowledge_service   ·   393 个 provider 类完整清单</text>
<text x="58" y="189" font-size="26" fill="#9aaac0" font-weight="700">01</text>
<text x="58" y="220" font-size="18" fill="#52657f" font-weight="700">执行入口</text>
<text x="58" y="361" font-size="26" fill="#9aaac0" font-weight="700">02</text>
<text x="58" y="392" font-size="18" fill="#52657f" font-weight="700">流程编排</text>
<text x="58" y="578" font-size="26" fill="#9aaac0" font-weight="700">03</text>
<text x="58" y="609" font-size="18" fill="#52657f" font-weight="700">共享领域</text>
<text x="58" y="795" font-size="26" fill="#9aaac0" font-weight="700">04</text>
<text x="58" y="826" font-size="18" fill="#52657f" font-weight="700">发布恢复</text>
<text x="58" y="983" font-size="26" fill="#9aaac0" font-weight="700">05</text>
<text x="58" y="1014" font-size="18" fill="#52657f" font-weight="700">知识消费</text>
