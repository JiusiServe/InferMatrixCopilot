<rect x="180" y="155" width="620" height="140" rx="14" fill="#ffffff" stroke="#dbe4ef"/>
<rect x="180" y="167" width="5" height="116" rx="2" fill="#245fc7"/>
<text x="204" y="192" font-size="23" fill="#245fc7" font-weight="700">Copilot 执行入口</text>
<text x="204" y="227" font-size="17" fill="#4d6179" font-weight="400" class="code">Copilot / kb init / knowledge.init</text>
<text x="204" y="256" font-size="19" fill="#4d6179" font-weight="400">绑定范围与版本；提交同一初始化计划</text>
<rect x="830" y="155" width="620" height="140" rx="14" fill="#ffffff" stroke="#dbe4ef"/>
<rect x="830" y="167" width="5" height="116" rx="2" fill="#087c72"/>
<text x="854" y="192" font-size="23" fill="#087c72" font-weight="700">维护调度入口</text>
<text x="854" y="227" font-size="17" fill="#4d6179" font-weight="400" class="code">Scheduler / kb serve → KbRuntime</text>
<text x="854" y="256" font-size="19" fill="#4d6179" font-weight="400">原有调度顺序与租约；提交维护计划</text>
<rect x="180" y="327" width="620" height="185" rx="14" fill="#ffffff" stroke="#dbe4ef"/>
<rect x="180" y="339" width="5" height="161" rx="2" fill="#245fc7"/>
<text x="204" y="364" font-size="23" fill="#245fc7" font-weight="700">初始化：建立可验收的知识基线</text>
<text x="204" y="399" font-size="17" fill="#4d6179" font-weight="400" class="code">init_execution → WorkflowExecution.execute</text>
<text x="204" y="428" font-size="17" fill="#4d6179" font-weight="400" class="code">prepare → draft → validate</text>
<text x="204" y="457" font-size="17" fill="#4d6179" font-weight="400" class="code">prepare_publication → publish</text>
<text x="204" y="486" font-size="19" fill="#4d6179" font-weight="400">InitRecord：pin、正文、证据、费用与发布事实</text>
<rect x="830" y="327" width="620" height="185" rx="14" fill="#ffffff" stroke="#dbe4ef"/>
<rect x="830" y="339" width="5" height="161" rx="2" fill="#087c72"/>
<text x="854" y="364" font-size="23" fill="#087c72" font-weight="700">维护：更新 · 主动复查 · 纠错</text>
<text x="854" y="399" font-size="17" fill="#4d6179" font-weight="400" class="code">run_due → WorkflowExecution.execute</text>
<text x="854" y="428" font-size="17" fill="#4d6179" font-weight="400" class="code">correction → nightly_audit（两步均重验）</text>
<text x="854" y="457" font-size="19" fill="#4d6179" font-weight="400">MaintenanceStore：周期、请求、预留与发现</text>
<text x="854" y="486" font-size="19" fill="#4d6179" font-weight="400">领域 SQLite 持有进度；执行器不复制业务账本</text>
<rect x="180" y="544" width="620" height="185" rx="14" fill="#ffffff" stroke="#dbe4ef"/>
<rect x="180" y="556" width="5" height="161" rx="2" fill="#7251ae"/>
<text x="204" y="581" font-size="23" fill="#7251ae" font-weight="700">内容与原始证据</text>
<text x="204" y="616" font-size="17" fill="#4d6179" font-weight="400" class="code">Page · Section · Footer · KnowledgeOperation</text>
<text x="204" y="645" font-size="19" fill="#4d6179" font-weight="400">Claim · Evidence · 适用版本与正文身份</text>
<text x="204" y="674" font-size="17" fill="#4d6179" font-weight="400" class="code">init_content · git_objects（共用机制）</text>
<text x="204" y="703" font-size="19" fill="#4d6179" font-weight="400">候选有界生成／修复；各入口保留范围约束</text>
<rect x="830" y="544" width="620" height="185" rx="14" fill="#ffffff" stroke="#dbe4ef"/>
<rect x="830" y="556" width="5" height="161" rx="2" fill="#7251ae"/>
<text x="854" y="581" font-size="23" fill="#7251ae" font-weight="700">审核与准入</text>
<text x="854" y="616" font-size="17" fill="#4d6179" font-weight="400" class="code">gate · maintenance_policy</text>
<text x="854" y="645" font-size="19" fill="#4d6179" font-weight="400">确定性验证 · 独立语义审核 · 一致性</text>
<text x="854" y="674" font-size="19" fill="#4d6179" font-weight="400">受保护约束 · 纠错资格 · 当前证据复验</text>
<text x="854" y="703" font-size="17" fill="#4d6179" font-weight="400" class="code">maintenance_resolution 追加负责人处置</text>
<rect x="180" y="761" width="620" height="156" rx="14" fill="#ffffff" stroke="#dbe4ef"/>
<rect x="180" y="773" width="5" height="132" rx="2" fill="#245fc7"/>
<text x="204" y="798" font-size="23" fill="#245fc7" font-weight="700">各自权限内的受治理发布</text>
<text x="204" y="833" font-size="17" fill="#4d6179" font-weight="400" class="code">InitPublisher · Publisher · activate</text>
<text x="204" y="862" font-size="19" fill="#4d6179" font-weight="400">签名 → Git 交接 → 合并 → 快照激活</text>
<text x="204" y="891" font-size="19" fill="#4d6179" font-weight="400">候选成功应用仍不等于正式发布</text>
<rect x="830" y="761" width="620" height="156" rx="14" fill="#ffffff" stroke="#dbe4ef"/>
<rect x="830" y="773" width="5" height="132" rx="2" fill="#087c72"/>
<text x="854" y="798" font-size="23" fill="#087c72" font-weight="700">撤回、传播与恢复</text>
<text x="854" y="833" font-size="19" fill="#4d6179" font-weight="400">containment · 签名代际 · 消费者 ACK</text>
<text x="854" y="862" font-size="19" fill="#4d6179" font-weight="400">撤回独立于快照；回滚不能清除禁用</text>
<text x="854" y="891" font-size="19" fill="#4d6179" font-weight="400">仅恢复获准新内容；历史回执保持完整</text>
<rect x="180" y="949" width="620" height="185" rx="14" fill="#ffffff" stroke="#dbe4ef"/>
<rect x="180" y="961" width="5" height="161" rx="2" fill="#245fc7"/>
<text x="204" y="986" font-size="23" fill="#245fc7" font-weight="700">任务知识与版本化 SDK v1</text>
<text x="204" y="1021" font-size="17" fill="#4d6179" font-weight="400" class="code">KnowledgeView · KnowledgeDocs</text>
<text x="204" y="1050" font-size="17" fill="#4d6179" font-weight="400" class="code">KnowledgeContextService</text>
<text x="204" y="1079" font-size="17" fill="#4d6179" font-weight="400" class="code">ReviewRuntime / KnowledgeCurator</text>
<text x="204" y="1108" font-size="19" fill="#4d6179" font-weight="400">固定快照、限定读取、会话预算和使用回执</text>
<rect x="830" y="949" width="620" height="185" rx="14" fill="#ffffff" stroke="#dbe4ef"/>
<rect x="830" y="961" width="5" height="161" rx="2" fill="#087c72"/>
<text x="854" y="986" font-size="23" fill="#087c72" font-weight="700">Review bot：经 SDK 读取与消费</text>
<text x="854" y="1021" font-size="17" fill="#4d6179" font-weight="400" class="code">ReviewPipeline · KnowledgeDistiller</text>
<text x="854" y="1050" font-size="17" fill="#4d6179" font-weight="400" class="code">KnowledgeMaintenance · ReviewPublisher</text>
<text x="854" y="1079" font-size="19" fill="#4d6179" font-weight="400">公开边界仅 SDK v1；候选交权威维护审核</text>
<text x="854" y="1108" font-size="19" fill="#4d6179" font-weight="400">Direct / Strict 共用发布前可用性检查</text>
<rect x="180" y="1165" width="1270" height="109" rx="14" fill="#eaf0f8" stroke="#d6e0ee"/>
<text x="202" y="1198" font-size="21" fill="#334f73" font-weight="700">共享底座：执行锁与恢复 · 预留与结算 · 原生模型回执 · Git 对象 · 原子写入</text>
<text x="202" y="1232" font-size="19" fill="#52657f" font-weight="400">单所有者：InitRecord｜维护 SQLite｜improve 周预算｜发布 outbox｜消费会话｜撤回高水位</text>
<text x="60" y="1311" font-size="16" fill="#64758b" font-weight="400">箭头表达职责与交付关系，不是逐函数调用图。执行内核不反向依赖知识流程；bot 运行代码仅依赖 SDK v1。</text>
<text x="60" y="1336" font-size="14" fill="#71829a" font-weight="400">源码树摘要：d33216d221d50abf  ·  完整源路径、嵌套／局部类与文件摘要见 HTML / JSON</text>
</svg>
